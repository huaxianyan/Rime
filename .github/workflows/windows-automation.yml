name: Windows automation

on:
  push:
    branches: [windows-automation]
    tags: ['windows-automation-v*']
    paths: ['windows/**', '.github/workflows/windows-automation.yml', 'LICENSE']
  pull_request:
    branches: [windows-automation]
    paths: ['windows/**', '.github/workflows/windows-automation.yml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify release source
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$project = Get-Content windows/RimeAutomation/RimeAutomation.csproj -Raw
          $expected = 'windows-automation-v' + $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw 'Tag does not match project version.' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/windows-automation
          if ($LASTEXITCODE) { throw 'Release commit must belong to windows-automation.' }
      - name: Build and package
        shell: pwsh
        # 任务使用交互式登录身份，集成验证在发布前的本地 Windows 桌面会话中执行。
        run: ./windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/windows-automation-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file windows/RELEASE_NOTES.md
